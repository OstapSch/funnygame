function toTrianglesDrawMode( geometry, drawMode ) {

	if ( drawMode === TrianglesDrawMode ) {

		console.warn( 'THREE.BufferGeometryUtils.toTrianglesDrawMode(): Geometry already defined as triangles.' );
		return geometry;

	}

	if ( drawMode === TriangleFanDrawMode || drawMode === TriangleStripDrawMode ) {

		let index = geometry.getIndex();

		// generate index if not present

		if ( index === null ) {

			const indices = [];

			const position = geometry.getAttribute( 'position' );

			if ( position !== undefined ) {

				for ( let i = 0; i < position.count; i ++ ) {

					indices.push( i );

				}

				geometry.setIndex( indices );
				index = geometry.getIndex();

			} else {

				console.error( 'THREE.BufferGeometryUtils.toTrianglesDrawMode(): Undefined position attribute. Processing not possible.' );
				return geometry;

			}

		}

		//

		const numberOfTriangles = index.count - 2;
		const newIndices = [];

		if ( drawMode === TriangleFanDrawMode ) {

			// gl.TRIANGLE_FAN

			for ( let i = 1; i <= numberOfTriangles; i ++ ) {

				newIndices.push( index.getX( 0 ) );
				newIndices.push( index.getX( i ) );
				newIndices.push( index.getX( i + 1 ) );

			}

		} else {

			// gl.TRIANGLE_STRIP

			for ( let i = 0; i < numberOfTriangles; i ++ ) {

				if ( i % 2 === 0 ) {

					newIndices.push( index.getX( i ) );
					newIndices.push( index.getX( i + 1 ) );
					newIndices.push( index.getX( i + 2 ) );

				} else {

					newIndices.push( index.getX( i + 2 ) );
					newIndices.push( index.getX( i + 1 ) );
					newIndices.push( index.getX( i ) );

				}

			}

		}

		if ( ( newIndices.length / 3 ) !== numberOfTriangles ) {

			console.error( 'THREE.BufferGeometryUtils.toTrianglesDrawMode(): Unable to generate correct amount of triangles.' );

		}

		// build final geometry

		const newGeometry = geometry.clone();
		newGeometry.setIndex( newIndices );
		newGeometry.clearGroups();

		return newGeometry;

	} else {

		console.error( 'THREE.BufferGeometryUtils.toTrianglesDrawMode(): Unknown draw mode:', drawMode );
		return geometry;

	}

		parser.setPlugins( plugins );

/**
 * Punctual Lights Extension
 *
 * Specification: https://github.com/KhronosGroup/glTF/tree/master/extensions/2.0/Khronos/KHR_lights_punctual

class GLTFLightsExtension {

	constructor( parser ) {

		this.parser = parser;
		this.name = EXTENSIONS.KHR_LIGHTS_PUNCTUAL;

		// Object3D instance caches
		this.cache = { refs: {}, uses: {} };

	}

	_markDefs() {

		const parser = this.parser;
		const nodeDefs = this.parser.json.nodes || [];

		for ( let nodeIndex = 0, nodeLength = nodeDefs.length; nodeIndex < nodeLength; nodeIndex ++ ) {

			const nodeDef = nodeDefs[ nodeIndex ];

			if ( nodeDef.extensions
					&& nodeDef.extensions[ this.name ]
					&& nodeDef.extensions[ this.name ].light !== undefined ) {

				parser._addNodeRef( this.cache, nodeDef.extensions[ this.name ].light );

			}

		}

	_loadLight( lightIndex ) {

		const parser = this.parser;
		const cacheKey = 'light:' + lightIndex;
		let dependency = parser.cache.get( cacheKey );

		if ( dependency ) return dependency;

		const json = parser.json;
		const extensions = ( json.extensions && json.extensions[ this.name ] ) || {};
		const lightDefs = extensions.lights || [];
		const lightDef = lightDefs[ lightIndex ];
		let lightNode;

		const color = new Color( 0xffffff );

		if ( lightDef.color !== undefined ) color.setRGB( lightDef.color[ 0 ], lightDef.color[ 1 ], lightDef.color[ 2 ], LinearSRGBColorSpace );

		switch ( lightDef.type ) {

			case 'directional':
				lightNode = new DirectionalLight( color );
				lightNode.target.position.set( 0, 0, - 1 );
				lightNode.add( lightNode.target );
				break;

			case 'point':

				lightNode.distance = range;
				break;

				lightNode.penumbra = 1.0 - lightDef.spot.innerConeAngle / lightDef.spot.outerConeAngle;
				lightNode.target.position.set( 0, 0, - 1 );
				lightNode.add( lightNode.target );
				break;

			default:
				throw new Error( 'THREE.GLTFLoader: Unexpected light type: ' + lightDef.type );

/**
 * Unlit Materials Extension
 *
 * Specification: https://github.com/KhronosGroup/glTF/tree/master/extensions/2.0/Khronos/KHR_materials_unlit
 */
class GLTFMaterialsUnlitExtension {

	constructor() {

		this.name = EXTENSIONS.KHR_MATERIALS_UNLIT;

	}

	getMaterialType() {

		return MeshBasicMaterial;

	}

	extendParams( materialParams, materialDef, parser ) {

		const pending = [];

		materialParams.color = new Color( 1.0, 1.0, 1.0 );
		materialParams.opacity = 1.0;

		const metallicRoughness = materialDef.pbrMetallicRoughness;

		if ( metallicRoughness ) {

			if ( Array.isArray( metallicRoughness.baseColorFactor ) ) {

				const array = metallicRoughness.baseColorFactor;

				materialParams.color.setRGB( array[ 0 ], array[ 1 ], array[ 2 ], LinearSRGBColorSpace );
				materialParams.opacity = array[ 3 ];

			}

			if ( metallicRoughness.baseColorTexture !== undefined ) {

				pending.push( parser.assignTexture( materialParams, 'map', metallicRoughness.baseColorTexture, SRGBColorSpace ) );

			}

		}

		return Promise.all( pending );

	}

}

	constructor( parser ) {

		this.parser = parser;
		this.name = EXTENSIONS.KHR_MATERIALS_EMISSIVE_STRENGTH;

	extendMaterialParams( materialIndex, materialParams ) {

		const parser = this.parser;
		const materialDef = parser.json.materials[ materialIndex ];

		if ( ! materialDef.extensions || ! materialDef.extensions[ this.name ] ) {

			return Promise.resolve();

		const emissiveStrength = materialDef.extensions[ this.name ].emissiveStrength;

		if ( emissiveStrength !== undefined ) {

			materialParams.emissiveIntensity = emissiveStrength;

		}

		return Promise.resolve();

	}

/* =====================================================================
   3. УТИЛИТЫ
   ===================================================================== */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; // easeInOutCubic
const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const inRect = (x, y, r) => x >= r[0] && y >= r[1] && x < r[0] + r[2] && y < r[1] + r[3];
function mulberry32(a) {
  return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function shuffle(arr, rnd) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
const pick = (arr, rnd) => arr[Math.floor(rnd() * arr.length)];
function fmtClock(sec) { sec = Math.max(0, Math.floor(sec)); return String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0'); }

/* =====================================================================
   4. ЗВУК — только синтез WebAudio
   ===================================================================== */
const SFX = {
  ctx: null, master: null, muted: false, humOsc: null, humGain: null,
  init() {
    if (this.ctx) return;
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain(); this.master.gain.value = 0.22; this.master.connect(this.ctx.destination);
      this.humGain = this.ctx.createGain(); this.humGain.gain.value = 0; this.humGain.connect(this.master);
      this.humOsc = this.ctx.createOscillator(); this.humOsc.type = 'sawtooth'; this.humOsc.frequency.value = 55;
      const f = this.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 180;
      this.humOsc.connect(f); f.connect(this.humGain); this.humOsc.start();
    } catch (e) { console.warn('WebAudio недоступен', e); this.ctx = null; }
  },
  ok() { return this.ctx && !this.muted && !(game && game.sim); },
  tone(freq, dur, type = 'sine', vol = 0.5, delay = 0, slideTo = 0) {
    if (!this.ok()) return;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master); o.start(t0); o.stop(t0 + dur + 0.02);
  },
  blup() { this.tone(520, 0.16, 'sine', 0.35, 0, 880); },
  alarm() { this.tone(740, 0.12, 'square', 0.12); this.tone(740, 0.12, 'square', 0.12, 0.18); },
  click() { this.tone(1800, 0.03, 'triangle', 0.25); },
  chordUp() { [523, 659, 784].forEach((f, i) => this.tone(f, 0.28, 'triangle', 0.25, i * 0.06)); },
  chordDown() { [392, 330, 262].forEach((f, i) => this.tone(f, 0.3, 'sawtooth', 0.12, i * 0.08)); },
  thud() { this.tone(120, 0.18, 'sine', 0.6, 0, 50); },
  notif() { this.tone(988, 0.08, 'sine', 0.2); this.tone(1319, 0.12, 'sine', 0.18, 0.07); },
  setHum(level) { if (!this.ctx) return; this.humGain.gain.setTargetAtTime(this.muted ? 0 : level * 0.35, this.ctx.currentTime, 0.3); },
  toggleMute() { this.muted = !this.muted; if (this.muted) this.setHum(0); },
};

    ui: { regions: [], phoneRegions: [], hover: null, phoneHover: null },
    screenDirty: true, phoneDirty: true, sig: 0, phoneSig: 0,
    result: null,
  };
  for (const cfg of CONFIG.URGES) g.urges[cfg.id] = new Urge(cfg);
  g.deck = shuffle(TASKS.map((_, i) => i), rnd);
  // стартовые сообщения в чатах
  g.wins.vr.msgs.push({ from: TEAM[1], text: 'всем привет, сдаём в пятницу' }, { from: TEAM[0], text: 'я сделал презу' });
  g.wins.temki.msgs.push({ from: TEAM[2], text: 'тут только темки, без флуда' });
  return g;
}

/* =====================================================================
   6. ПОЗЫВЫ — один класс, девять конфигов
   ===================================================================== */
// Поведение каждой привычки. Числа — в CONFIG.URGES.
const URGE_HOOKS = {
  reels: {
    minigame: 'phoneReels',
    canFill: () => !(game.action && game.action.phoneMode === 'reels'),

    onReset: () => startPhone('reels'),
    onOverflow: () => chatMsg('vr', TEAM[0], 'МИША. РИЛС. СЕЙЧАС.'),

  },

    onReset: () => startPhone('temki'),

  },
  audio: {

    onReset: () => toggleAudio(),
    onOverflow: (u) => {
      notify('Книги', 'Ты обещал дослушать «Войну и мир». Прогресс −8%', '#ff3b30', 'К', () => urgeKey('audio'), '3');
      addProgress(CONFIG.AUDIO_OVERFLOW_PROGRESS);
      u.value = 0; u.active = false; // копится снова
    },
  },
  poem: {
    minigame: 'notes',
    canFill: () => !game.wins.notes1.open && !game.wins.notes2.open,
    warn: { 75: () => notify('Заметки', 'в голову лезет стих про преподавателя', '#d4a800', 'З', () => urgeKey('poem'), '4') },
    onReset: () => openNotes('notes1', false),
    onOverflow: () => openNotes('notes1', true),
    onTick: () => {},
  },
  sleep: {
    minigame: null,
    fillMult: () => game.windowOpen ? CONFIG.SLEEP_WINDOW_MULT : 1,
    warn: { 70: () => notify('Миша', 'глаза слипаются… вздремнуть 8 секунд?', '#5856d6', 'С', () => urgeKey('sleep'), '5'), 90: () => notify('Миша', 'сейчас вырублюсь прямо на клавиатуре', '#ff3b30', 'С', () => urgeKey('sleep'), '5') },
    onReset: () => startBreak('sleep', false),
    onOverflow: () => startBreak('sleep', true),
  },
  pushups: {
    minigame: 'pushups',
    warn: { 45: () => chatMsg('vr', TEAM[0], PUSHUP_TAUNTS[0]), 75: () => { chatMsg('vr', TEAM[2], PUSHUP_TAUNTS[1]); notify('Дима', 'спорим, ты не отожмёшься?', '#ff6b3d', 'Д', () => urgeKey('pushups'), '6'); } },
    onReset: () => startBreak('pushups', false),
    onOverflow: () => { chatMsg('vr', TEAM[0], PUSHUP_TAUNTS[2]); startBreak('pushups', true); },
  },
  water: {
    minigame: null,
    warn: { 75: () => notify('Миша', 'горло пересохло, стакан рядом', '#30b0c7', 'В', () => urgeKey('water'), '7') },
    onReset: () => startBreak('water', false),
    onOverflow: () => startBreak('water', true),
  },
  chair: {
    minigame: null,
    warn: { 72: () => notify('Миша', 'спина затекла, мышь как будто скользкая', '#8e8e93', 'Ё', () => urgeKey('chair'), 'Пробел') },
    onReset: () => startBreak('chair', false),
    onOverflow: () => startBreak('chair', true),
  },
  air: {
    minigame: null,
    canFill: () => !game.windowOpen,
    warn: { 75: () => notify('Миша', 'душно… открыть окно?', '#34c759', 'О', () => urgeKey('air'), '8') },
    onReset: () => startBreak('air', false),
    onOverflow: () => startBreak('air', true),
  },
};

class Urge {
  constructor(cfg) {
    Object.assign(this, cfg, URGE_HOOKS[cfg.id]);
    this.value = 0;          // 0..100
    this.active = false;     // окно сработало и ждёт игрока
    this.pending = false;    // перерыв сработал, но Миша занят
    this.activeT = 0; this.tickT = 0;
    this.warned = {}; this.alarmed = false;
  }
  update(dt) {
    if (this.active) {
      this.activeT += dt;
      if (this.tickEvery > 0) {
        this.tickT += dt;
        while (this.tickT >= this.tickEvery) { this.tickT -= this.tickEvery; if (this.onTick) this.onTick(this); addConc(this.tickConc); }
      }
      return;
    }
    if (this.pending) { tryStartPending(this); return; }
    if (game.action && game.action.urge === this.id) return; // обслуживается
    if (this.canFill && !this.canFill()) return;
    const fill = this.fillTime * (this.fillMult ? this.fillMult() : 1);
    this.value += 100 * dt * game.difficulty / fill;
    for (const k in this.warn || {}) {
      if (this.value >= +k && !this.warned[k]) { this.warned[k] = true; this.warn[k](this); }
    }
    if (this.value >= CONFIG.WARN_ALARM && !this.alarmed) { this.alarmed = true; SFX.alarm(); }
    if (this.value >= 100) this.trigger();
  }
  trigger() {
    this.value = 100;
    distraction();
    if (this.kind === 'window') {
      this.active = true; this.activeT = 0; this.tickT = 0;
      addConc(this.concOverflow);
      this.onOverflow(this);
    } else {
      this.pending = true;
      tryStartPending(this);
    }
    markDirty();
  }
  // сброс: значение в ноль, флаги предупреждений обратно
  clear() { this.value = 0; this.active = false; this.pending = false; this.activeT = 0; this.tickT = 0; this.warned = {}; this.alarmed = false; markDirty(); }
}

function tryStartPending(u) {
  if (game.action) return;
  if (game.cam.t < 1 && game.cam.to !== 'FIRST') return;
  u.pending = false;
  u.onOverflow(u);
}

// Игрок (или горячая клавиша) просит обслужить привычку
function urgeKey(id) {
  if (game.phase !== 'play' || game.paused) return;
  const u = game.urges[id];
  if (id === 'audio') { toggleAudio(); return; }
  if (game.action) {
    if (game.action.kind === 'phone' && (id === 'reels' || id === 'temki')) { switchPhone(id); return; }
    return; // Миша занят
  }
  if (game.cam.t < 1) return;
  if (u.pending) { tryStartPending(u); return; }
  if (u.onReset) u.onReset(u);
}

function addConc(d) { if (!d) return; game.concentration = clamp(game.concentration + d, 0, 100); markDirty(); }
function addProgress(d) { game.progress = game.noCap ? Math.max(0, game.progress + d) : clamp(game.progress + d, 0, 100); markDirty(); }
function distraction() {
  game.stats.distractions++;
  game.stats.longest = Math.max(game.stats.longest, game.streak);
  game.streak = 0;
}

/* =====================================================================
   7. ДЕЙСТВИЯ МИШИ — пока Миша занят, учёба стоит, а позывы копятся
   ===================================================================== */
// action = { kind, urge, overflow, t, dur, cam, anim, update(dt), finish() }
function startAction(a) {
  if (game.action) { if (!game.queued) game.queued = a; return false; }
  a.t = 0;
  game.action = a;
  if (!a.silent) distraction();
  if (a.cam) setCam(a.cam);
  if (a.start) a.start(a);
  markDirty();
  return true;
}

function endAction() {
  const a = game.action;
  if (!a) return;
  game.action = null;
  if (a.finish) a.finish(a);
  game.focus = 'study';
  if (game.queued) { const q = game.queued; game.queued = null; startAction(q); }
  else if (a.cam) { setCam('FIRST'); playAnim('SITTING'); }
  markDirty();
}

function updateAction(dt) {
  const a = game.action;
  if (!a) return;
  a.t += dt;
  if (a.update) a.update(a, dt);
  if (a.dur != null && a.t >= a.dur) endAction();
}

// --- перерывы (kind 'break')
const BREAK_DEFS = {
  sleep: {
    anim: 'SLEEP',
    finish: (a) => { addConc(CONFIG.SLEEP_CONC); game.stats.sleepSec += a.dur; },
  },
  water: {
    anim: 'DRINK',
    finish: (a, u) => {
      addConc(a.overflow ? u.concOverflow : CONFIG.WATER_CONC);
      game.stats.glasses++;
      const ch = game.urges.chair; ch.value = Math.min(99.9, ch.value + CONFIG.WATER_CHAIR_ADD);
    },
  },
  chair: {
    anim: (a) => a.overflow ? 'FIDGET' : 'STRETCH',
    finish: (a, u) => { if (a.overflow) { addConc(u.concOverflow); game.misclickT = CONFIG.CHAIR_AFTER_OVERFLOW; } },
  },
  air: {
    anim: 'OPEN_WINDOW',
    update: (a) => { if (!a.toggled && a.t >= a.dur * 0.45) { a.toggled = true; setRoomWindow(a.overflow ? true : !game.windowOpen); } },
    finish: (a, u) => { if (!a.toggled) setRoomWindow(a.overflow ? true : !game.windowOpen); if (a.overflow) addConc(u.concOverflow); },
  },
  pushups: {
    anim: 'PUSHUPS',
    // заранее — спокойный подход без мини-игры; переполнение — мини-игра на пробел
    start: (a) => {
      game.pushup = { reps: 0, need: CONFIG.PUSHUP_REPS, limit: CONFIG.PUSHUP_TIME, t: 0, prep: 1.0, auto: !a.overflow, done: false, failed: false, pulse: 0 };
      if (a.overflow) a.dur = null; // длительность решает мини-игра
    },
    update: (a, dt) => {
      const p = game.pushup;
      p.pulse = Math.max(0, p.pulse - dt * 2);
      if (a.t < p.prep) return;
      p.t += dt;
      if (p.auto) {
        const want = Math.min(p.need, Math.floor(p.t / ((a.dur - p.prep - 0.8) / p.need)));
        while (p.reps < want) pushupRep(true);
        return;
      }
      if (p.done) { if (p.t >= p.doneAt + 0.9) endAction(); return; }
      if (p.failed) { if (a.t >= CONFIG.URGES.find(c => c.id === 'pushups').overflowCost) endAction(); return; }
      if (p.t >= p.limit) { p.failed = true; markDirty(); }
    },
    finish: (a, u) => {
      const p = game.pushup;
      game.stats.pushups += p.reps;
      if (p.failed) { addConc(u.concOverflow); chatMsg('vr', TEAM[0], 'ну я же говорил'); }
      else chatMsg('vr', 'me', 'сделал 10, вопросы?');
      game.pushup = null;
    },
  },
};

function startBreak(id, overflow) {
  const u = game.urges[id], def = BREAK_DEFS[id];
  const a = {
    kind: 'break', urge: id, overflow, cam: 'THIRD',
    dur: overflow ? u.overflowCost : u.resetCost,
    silent: overflow, // переполнение уже посчитано как отвлечение в trigger()
    start: (a) => { u.value = 100; if (def.start) def.start(a); playAnim(typeof def.anim === 'function' ? def.anim(a) : def.anim, a); },
    update: def.update,
    finish: (a) => { if (def.finish) def.finish(a, u); u.clear(); },
  };
  if (!startAction(a)) { if (overflow) u.pending = true; }
}

function pushupRep(auto) {
  const p = game.pushup;
  if (!p || p.done || p.failed) return;
  if (!auto && game.action.t < p.prep) return;
  p.reps++; p.pulse = 1;
  SFX.thud();
  if (!p.auto && p.reps >= p.need) { p.done = true; p.doneAt = p.t; }
  markDirty();
}

function setRoomWindow(open) {
  if (open && !game.windowOpen) game.stats.windowOpens++;
  game.windowOpen = open;
  game.urges.air.clear();
}

// --- телефон: рилсы и темки
function startPhone(mode) {
  const u = game.urges[mode];
  const a = {
    kind: 'phone', urge: mode, phoneMode: mode, cam: 'PHONE', dur: null,
    start: () => { preparePhone(mode); playAnim('PHONE'); },
    update: (a, dt) => updatePhone(a, dt),
    finish: () => { game.phone.sendT = -1; },
  };
  startAction(a);
}

function preparePhone(mode) {
  const ph = game.phone, rnd = game.rnd;
  ph.mode = mode; ph.sel = -1; ph.sendT = -1; ph.flash = 0;
  game.action.phoneMode = mode; game.action.urge = mode;
  if (mode === 'reels') ph.reels = shuffle(REELS.slice(), rnd).slice(0, 3);
  else { ph.posts = shuffle(POSTS.slice(), rnd).slice(0, 6); ph.hl = -1; ph.hlOn = false; ph.hlT = 0.8; }
  game.phoneDirty = true;
}

function switchPhone(mode) { if (game.phone.mode === mode || game.phone.sendT >= 0) return; preparePhone(mode); }

function updatePhone(a, dt) {
  const ph = game.phone;
  if (ph.flash > 0) { ph.flash = Math.max(0, ph.flash - dt); game.phoneDirty = true; }
  if (ph.mode === 'temki' && ph.sendT < 0) {
    ph.hlT -= dt;
    if (ph.hlT <= 0) {
      if (ph.hlOn) { ph.hlOn = false; ph.hl = -1; ph.hlT = CONFIG.TEMKI_HL_OFF; }
      else { ph.hlOn = true; ph.hl = Math.floor(game.rnd() * ph.posts.length); ph.hlT = CONFIG.TEMKI_HL_ON; }
      game.phoneDirty = true;
    }
  }
  if (ph.sendT >= 0) {
    ph.sendT += dt; game.phoneDirty = true;
    const u = game.urges[ph.mode];
    if (ph.sendT >= 0.6 && a.t >= u.resetCost) phoneDone();
  }
}

function phonePickReel(i) { const ph = game.phone; if (ph.sendT >= 0) return; ph.sel = i; SFX.click(); game.phoneDirty = true; }
function phoneSend() { const ph = game.phone; if (ph.sel < 0 || ph.sendT >= 0) return; ph.sendT = 0; SFX.click(); game.phoneDirty = true; }
function phoneTapPost(i) {
  const ph = game.phone; if (ph.sendT >= 0) return;
  if (ph.hlOn && i === ph.hl) { ph.sel = i; ph.sendT = 0; SFX.click(); }
  else { ph.flash = 0.3; }
  game.phoneDirty = true;
}
function phoneDone() {
  const ph = game.phone, mode = ph.mode;
  if (mode === 'reels') {
    const r = ph.reels[ph.sel];
    chatMsg('vr', 'me', '▶ ' + r.title, true);
    chatMsg('vr', pick(TEAM, game.rnd), pick(REELS_THANKS, game.rnd), true);
    game.wins.vr.unread = 0; game.stats.reels++;
  } else {
    if (!game.wins.temki.open) openWin('temki');
    chatMsg('temki', 'me', '↪ ' + ph.posts[ph.sel], true);
    chatMsg('temki', pick(TEAM, game.rnd), pick(TEMKI_THANKS, game.rnd), true);
    game.wins.temki.unread = 0; game.stats.temki++;
  }
  SFX.blup();
  game.urges[mode].clear();
  endAction();
}
function togglePhone() {
  if (game.action && game.action.kind === 'phone') { endAction(); return; }
  if (game.action || game.cam.t < 1) return;
  const r = game.urges.reels, t = game.urges.temki;
  const mode = (t.active && !r.active) || (!r.active && t.value > r.value) ? 'temki' : 'reels';
  startPhone(mode);
}

// --- аудиокнига
function toggleAudio() {
  if (game.audioPlaying) { game.audioPlaying = false; SFX.click(); markDirty(); return; }
  if (game.action) return;
  const u = game.urges.audio;
  startAction({ kind: 'audio', urge: 'audio', cam: null, dur: u.resetCost, silent: true,
    finish: () => { game.audioPlaying = true; u.clear(); } });
  SFX.click();
}

// --- заметки со стихом
function openNotes(id, overflow) {
  const w = game.wins[id];
  if (w.open) return;
  const used = game.wins.notes1.open ? game.wins.notes1.poem : -1;
  let p; do { p = Math.floor(game.rnd() * POEMS.length); } while (p === used);
  Object.assign(w, { poem: p, chosen: -1, openT: 0, shownT: 0, overflow });
  openWin(id);
  game.focus = id;
  if (!overflow) distraction();
}
function notesChoose(id, i) {
  const w = game.wins[id];
  if (!w.open || w.chosen >= 0) return;
  w.chosen = i; w.shownT = 0; SFX.click(); markDirty();
}
function updateNotes(dt) {
  const u = game.urges.poem;
  for (const id of ['notes1', 'notes2']) {
    const w = game.wins[id];
    if (!w.open) continue;
    w.openT += dt;
    if (w.chosen >= 0) {
      w.shownT += dt;
      // минимум resetCost секунд с окном — столько стоит стих
      if (w.shownT >= CONFIG.POEM_SHOW_TIME && w.openT >= u.resetCost) {
        closeWin(id); game.stats.poems++;
        if (!game.wins.notes1.open && !game.wins.notes2.open) { u.clear(); game.focus = 'study'; }
      }
    } else if (id === 'notes1' && w.openT >= CONFIG.POEM_SECOND_AFTER && !game.wins.notes2.open && !w.spawned2) {
      w.spawned2 = true; openNotes('notes2', true); SFX.alarm();
    }
  }
  // тик штрафа идёт только пока стих не выбран
  if (u.active && ((game.wins.notes1.open && game.wins.notes1.chosen >= 0) || !game.wins.notes1.open) && !(game.wins.notes2.open && game.wins.notes2.chosen < 0)) u.tickT = 0;
}

/* =====================================================================
   8. УЧЁБА
   ===================================================================== */
function studyBlocked() { return game.wins.notes1.open || game.wins.notes2.open; }
function canStudy() {
  return game.phase === 'play' && !game.action && game.cam.mode === 'FIRST' && game.cam.t >= 1 && !studyBlocked() && game.focus === 'study';
}
function nextTask() {
  if (!game.deck.length) game.deck = shuffle(TASKS.map((_, i) => i), game.rnd);
  const q = TASKS[game.deck.pop()];
  const order = shuffle([0, 1, 2, 3], game.rnd);
  game.taskNo++;
  game.task = {
    q, options: order.map(i => q.options[i]), correct: order.indexOf(q.correct),
    base: CONFIG.ANSWER_BASE + game.concentration / 100 * CONFIG.ANSWER_CONC,
    frac: 0, state: 'ask', fbT: 0, chosen: -1, no: game.taskNo,
  };
  markDirty();
}
function taskMult() { return game.task && game.task.q.subject === 'cs' && game.audioPlaying ? CONFIG.AUDIO_CS_MULT : 1; }
function taskLimit() { return game.task ? game.task.base * taskMult() : 1; }

function updateStudy(dt) {
  if (game.bluffCD > 0) game.bluffCD = Math.max(0, game.bluffCD - dt);
  if (!canStudy()) return;
  game.streak += dt;
  const t = game.task;
  if (!t) { game.taskGap -= dt; if (game.taskGap <= 0) nextTask(); return; }
  if (t.state === 'ask') {
    t.frac += dt / taskLimit();
    if (t.frac >= 1) { // не успел
      t.state = 'timeout'; t.fbT = 0; addConc(CONFIG.TIMEOUT_CONC); game.stats.failed++; SFX.chordDown(); markDirty();
    }
  } else {
    t.fbT += dt;
    if (t.fbT >= CONFIG.FEEDBACK_TIME) { game.task = null; game.taskGap = CONFIG.TASK_GAP; markDirty(); }
  }
}
function answer(i) {
  const t = game.task;
  if (!t || t.state !== 'ask' || !canStudy()) return;
  t.chosen = i; t.fbT = 0;
  if (i === t.correct) { t.state = 'right'; addProgress(CONFIG.CORRECT_PROGRESS); addConc(CONFIG.CORRECT_CONC); game.stats.correct++; SFX.chordUp(); }
  else { t.state = 'wrong'; addProgress(CONFIG.WRONG_PROGRESS); addConc(CONFIG.WRONG_CONC); game.stats.failed++; SFX.chordDown(); }
  markDirty();
}
function bluff() {
  const t = game.task;
  if (!t || t.state !== 'ask' || game.bluffCD > 0 || !canStudy()) return;
  game.stats.bluffs++; game.bluffCD = CONFIG.BLUFF_COOLDOWN;
  if (game.rnd() < CONFIG.BLUFF_CHANCE) { addProgress(CONFIG.BLUFF_WIN); game.stats.bluffWins++; t.state = 'bluffWin'; SFX.chordUp(); }
  else { addProgress(CONFIG.BLUFF_LOSE); addConc(CONFIG.BLUFF_LOSE_CONC); t.state = 'bluffLose'; SFX.chordDown(); }
  t.fbT = 0; markDirty();
}

/* =====================================================================
   9. ОКНА И УВЕДОМЛЕНИЯ
   ===================================================================== */
function openWin(id) { const w = game.wins[id]; if (w.open) return; w.open = true; w.anim = 0; raise(id); markDirty(); }
function closeWin(id) { const w = game.wins[id]; w.open = false; if (game.focus === id) game.focus = 'study'; markDirty(); }
// поднять окно в своём слое; учебное приложение никогда не выше заметок — слои это гарантируют
function raise(id) {
  const z = game.zorder.filter(k => k !== id); z.push(id);
  game.zorder = z.sort((a, b) => game.wins[a].layer - game.wins[b].layer);
  markDirty();
}
function windowsBottomUp() { return game.zorder.filter(id => game.wins[id].open); }

function chatMsg(win, from, text, quiet) {
  const w = game.wins[win];
  w.msgs.push({ from, text });
  if (w.msgs.length > 14) w.msgs.shift();
  if (from !== 'me' && !quiet) { w.unread++; SFX.blup(); }
  markDirty();
}

function notify(title, text, color, letter, onClick, key) {
  game.notifs.unshift({ title, text, color, letter, onClick, key, age: 0 });
  if (game.notifs.length > CONFIG.NOTIF_MAX) game.notifs.length = CONFIG.NOTIF_MAX;
  SFX.notif(); markDirty();
}

function updateWindows(dt) {
  for (const id in game.wins) { const w = game.wins[id]; if (w.open && w.anim < 1) { w.anim = Math.min(1, w.anim + dt / 0.22); } }
  // чат проекта растёт вниз и влево с непрочитанными
  const vr = game.wins.vr, target = clamp(vr.unread / 8, 0, 1);
  if (Math.abs(vr.grow - target) > 0.001) {
    vr.grow += (target - vr.grow) * (1 - Math.exp(-dt * 5));
    const a = LAYOUT.vr, b = LAYOUT.vrMax;
    vr.rect = [lerp(a[0], b[0], vr.grow), a[1], lerp(a[2], b[2], vr.grow), lerp(a[3], b[3], vr.grow)];
    markDirty();
  }
  for (const n of game.notifs) n.age += dt;
  const before = game.notifs.length;
  game.notifs = game.notifs.filter(n => n.age < CONFIG.NOTIF_LIFE);
  if (game.notifs.length !== before) markDirty();
  // фокус перескакивает при низкой концентрации
  if (game.concentration < CONFIG.CONC_FOCUS_JUMP && game.phase === 'play') {
    game.focusJumpT += dt;
    if (game.focusJumpT >= CONFIG.FOCUS_JUMP_EVERY) {
      game.focusJumpT = 0;
      const cand = windowsBottomUp().filter(id => id !== 'study');
      if (cand.length && game.focus === 'study') { const id = pick(cand, game.rnd); raise(id); game.focus = id; game.wins[id].flash = 1; distraction(); }
    }
  } else game.focusJumpT = 0;
  for (const id in game.wins) { const w = game.wins[id]; if (w.flash > 0) { w.flash = Math.max(0, w.flash - dt * 1.5); } }
}

/* =====================================================================
   10. UPDATE — меняет только состояние
   ===================================================================== */
function markDirty() { if (game) game.screenDirty = true; }

function update(dt) {
  if (game.phase === 'intro') { updateIntro(dt); updateCam(dt); return; }
  if (game.phase !== 'play' || game.paused) { updateCam(dt); return; }
  game.elapsed += dt;
  game.difficulty = 1 + clamp(game.elapsed / CONFIG.SESSION, 0, 1) * CONFIG.DIFF_GAIN;
  game.concentration = clamp(game.concentration - CONFIG.CONC_DRAIN * dt, 0, 100);
  if (game.audioPlaying) game.bookPos += dt;
  if (game.misclickT > 0) game.misclickT = Math.max(0, game.misclickT - dt);

  for (const id in game.urges) game.urges[id].update(dt);
  updateAction(dt);
  updateNotes(dt);
  updateStudy(dt);
  updateWindows(dt);
  updateCam(dt);

  if (!game.sim) SFX.setHum(game.concentration < CONFIG.CONC_HUM ? (1 - game.concentration / CONFIG.CONC_HUM) : 0);

  // медленно меняющиеся значения — перерисовка, только если поменялось видимое
  let sig = Math.floor(game.elapsed) * 7 + Math.floor(game.progress) * 131 + Math.floor(game.bookPos / 2) * 17;
  for (const id in game.urges) sig = (sig * 31 + Math.floor(game.urges[id].value)) | 0;
  if (sig !== game.sig) { game.sig = sig; game.screenDirty = true; game.phoneDirty = true; }

  if (game.elapsed >= CONFIG.SESSION || (!game.noCap && game.progress >= 100)) endGame();
}

  const bat = Math.round(lerp(87, 14, clamp(game.elapsed / CONFIG.SESSION, 0, 1)));
  c.strokeStyle = '#333'; c.lineWidth = 1.5; rr(c, 1012, 9, 26, 13, 3); c.stroke(); c.fillStyle = '#333'; c.fillRect(1039, 13, 2, 5);
  c.fillStyle = bat < 20 ? UI.red : '#333'; c.fillRect(1014, 11, 22 * bat / 100, 9);
  c.font = F(13, 600); c.fillStyle = '#333'; c.textAlign = 'right'; c.fillText(bat + '%', 1006, 15); c.textAlign = 'left';

  const mx = 930;
  const hov = region('menubar', mx - 10, 0, 34, 28, 'mute', () => SFX.toggleMute());
  if (hov) { c.fillStyle = 'rgba(0,0,0,0.08)'; rr(c, mx - 10, 3, 34, 22, 6); c.fill(); }
  c.fillStyle = '#333'; c.beginPath(); c.moveTo(mx, 12); c.lineTo(mx + 5, 12); c.lineTo(mx + 11, 7); c.lineTo(mx + 11, 23); c.lineTo(mx + 5, 18); c.lineTo(mx, 18); c.closePath(); c.fill();
  c.strokeStyle = '#333'; c.lineWidth = 1.6;

  else { c.beginPath(); c.arc(mx + 12, 15, 5, -0.9, 0.9); c.stroke(); c.beginPath(); c.arc(mx + 12, 15, 9, -0.9, 0.9); c.stroke(); }

function renderScreen(now) {
  const c = sctx;
  game.ui.regions = [];
  if (game.screenOff || (game.phase === 'intro' && game.introT < 3.5)) {
    c.fillStyle = '#000'; c.fillRect(0, 0, 1280, 800);
    if (game.phase === 'intro' && game.introT > 3.1) { c.fillStyle = `rgba(255,255,255,${clamp((game.introT - 3.1) * 2, 0, 1)})`; c.font = F(64, 300); c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('◐', 640, 380); c.textAlign = 'left'; }
    return;
  }
  c.drawImage(wallCanvas, 0, 0);
  const heavy = game.concentration < CONFIG.CONC_HEAVY && game.phase === 'play';
  // во время интро окна появляются по одному
  const reveal = game.phase === 'intro' ? clamp((game.introT - 4.0) / 1.0, 0, 1) : 1;
  const order = windowsBottomUp();
  order.forEach((id, idx) => {
    const w = game.wins[id];
    const appear = game.phase === 'intro' ? clamp(reveal * order.length - idx, 0, 1) : w.anim;
    if (appear <= 0) return;
    c.save();
    const [x, y, ww, hh] = w.rect;
    if (appear < 1) { const s = 0.85 + 0.15 * ease(appear); c.globalAlpha = appear; c.translate(x + ww / 2, y + hh / 2); c.scale(s, s); c.translate(-x - ww / 2, -y - hh / 2); }
    if (heavy) c.translate((Math.random() * 2 - 1) * 1.5, (Math.random() * 2 - 1) * 1.5);
    if (id === 'study') drawStudy(c, w, now);
    else if (id === 'vr') drawChat(c, w, 'ПРОЕКТ ВР-1', game.urges.reels, 'Кинуть рилс', 'vrbtn', () => urgeKey('reels'));
    else if (id === 'temki') drawChat(c, w, 'ТЕМЩИКИ БП', game.urges.temki, 'Найти темку', 'tmbtn', () => urgeKey('temki'));
    else if (id === 'player') drawPlayer(c, w, now);
    else if (id === 'notes1') drawNotes(c, w, false);
    else if (id === 'notes2') drawNotes(c, w, true);
    c.restore();
  });
  drawNotifs(c);
  drawMenubar(c, now);
  // «пора учиться»
  if (game.bigText) {
    c.globalAlpha = game.bigText.a; c.fillStyle = '#fff'; c.font = F(96, 900); c.textAlign = 'center'; c.textBaseline = 'middle';
    c.shadowColor = 'rgba(0,0,0,0.35)'; c.shadowBlur = 30; c.fillText(game.bigText.text, 640, 400); c.shadowBlur = 0;
    c.textAlign = 'left'; c.globalAlpha = 1;
  }
  // расхождение каналов при очень низкой концентрации
  if (heavy) {
    fxctx.globalCompositeOperation = 'copy'; fxctx.drawImage(screenCanvas, 0, 0);
    fxctx.globalCompositeOperation = 'multiply'; fxctx.fillStyle = '#ff0000'; fxctx.fillRect(0, 0, 1280, 800);
    c.globalCompositeOperation = 'screen'; c.globalAlpha = 0.35; c.drawImage(fxCanvas, 3, 0);
    c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
  }
}

// нужно ли перерисовывать каждый кадр (анимации)
function screenAnimating() {
  if (game.phase === 'intro') return true;
  if (game.phase !== 'play') return false;
  const t = game.task;
  if (t && canStudy()) return true; // тикающий таймер, дрожание, пульс кнопки
  if (game.concentration < CONFIG.CONC_HEAVY) return true;
  if (CONFIG.SESSION - game.elapsed < 60) return true;
  for (const n of game.notifs) if (n.age < 0.3 || n.age > CONFIG.NOTIF_LIFE - 0.45) return true;
  for (const id in game.wins) { const w = game.wins[id]; if (w.open && (w.anim < 1 || w.flash > 0)) return true; }
  if (game.wins.notes1.open || game.wins.notes2.open) return true;
  if (game.audioPlaying) return true; // бегущая строка
  return false;
}

// Поза — набор чисел. Анимация = функция времени → целевая поза. Переходы плавные.
const POSE_SIT = {
  x: 0, y: 0.50, z: 0.58, ry: 0, rx: 0,
  torso: -0.08, breath: 0, headX: -0.18, headY: 0,
  lSh: 0.55, lShZ: 0.12, rSh: 0.55, rShZ: -0.12, lEl: 1.05, rEl: 1.05,
  lTh: Math.PI / 2, rTh: Math.PI / 2, lKn: -Math.PI / 2, rKn: -Math.PI / 2,
  chair: 0, glass: 0,
};
const POSE_STAND = Object.assign({}, POSE_SIT, { y: 0.88, z: 0.74, torso: 0, headX: 0, lSh: 0.05, rSh: 0.05, lShZ: 0.08, rShZ: -0.08, lEl: 0.15, rEl: 0.15, lTh: 0, rTh: 0, lKn: 0, rKn: 0, chair: 0.25 });
function mixPose(a, b, t) { const o = {}; for (const k in a) o[k] = lerp(a[k], b[k], t); return o; }
const WIN_SPOT = { x: -1.12, z: 0.25 };

const ANIMS = {
  SITTING: (t) => Object.assign({}, POSE_SIT, { headY: Math.sin(t * 0.5) * 0.05 }),
  TYPING: (t) => Object.assign({}, POSE_SIT, { headX: -0.25, lSh: 0.55 + Math.sin(t * 9) * 0.04, rSh: 0.55 + Math.sin(t * 9 + 2) * 0.04, lEl: 1.05 + Math.sin(t * 11) * 0.06, rEl: 1.05 + Math.sin(t * 12 + 1) * 0.06 }),
  PHONE: () => Object.assign({}, POSE_SIT, { headX: -0.35, headY: -0.15, rSh: 0.9, rEl: 1.0, rShZ: 0.1 }),
  FIDGET: (t) => {
    const amp = 0.4 + 0.6 * clamp(game.urges.chair.value / 100, 0, 1);
    return Object.assign({}, POSE_SIT, { x: Math.sin(t * Math.PI * 2 / 0.8) * 0.03 * amp * 1.5, ry: Math.sin(t * 5) * 0.12 * amp, torso: -0.05 + Math.sin(t * 7) * 0.08, headY: Math.sin(t * 3) * 0.3, lTh: Math.PI / 2 + Math.sin(t * 9) * 0.1 });
  },
  STAND_UP: (t) => mixPose(POSE_SIT, POSE_STAND, smooth(t / 0.6)),
  SIT_DOWN: (t) => mixPose(POSE_STAND, POSE_SIT, smooth(t / 0.6)),
  SLEEP: (t) => Object.assign({}, POSE_SIT, { z: 0.6, torso: -0.96, headX: -0.25, headY: 0.4, lSh: 1.35, rSh: 1.35, lShZ: 0.35, rShZ: -0.35, lEl: 1.5, rEl: 1.5, breath: Math.sin(t * 1.2) * 0.02 }),
  DRINK: (t, d) => {
    const p = clamp(t / d, 0, 1), half = Object.assign({}, POSE_SIT, { y: 0.6, z: 0.62, lTh: 1.2, rTh: 1.2, lKn: -1.0, rKn: -1.0, chair: 0.1 });
    let pose = mixPose(POSE_SIT, half, smooth(p / 0.12) * (1 - smooth((p - 0.88) / 0.12)));
    // левая рука (стакан стоит слева) тянется к стакану, подносит к голове
    const reach = smooth((p - 0.08) / 0.15) * (1 - smooth((p - 0.75) / 0.15));

// единственная точка входа: сменить состояние, следующая анимация — максимум одна
function playAnim(state, action) {

}

  S.screenCenter = c;

  CAMS.THIRD = { pos: new THREE.Vector3(1.7, 1.55, 1.5), look: new THREE.Vector3(0, 1.0, 0.1) };
  CAMS.THIRD_LOW = { pos: new THREE.Vector3(1.75, 1.35, 1.75), look: new THREE.Vector3(0.1, 0.65, 0.55) };
  CAMS.THIRD_WIDE = { pos: new THREE.Vector3(1.6, 1.6, 2.0), look: new THREE.Vector3(-0.6, 1.0, 0.2) };

function camPreset(mode) {

/* =====================================================================
   16. МОДЕЛИ — необязательный слой: удалось загрузить → заменяем примитив
   ===================================================================== */
function tryLoadModels() {
  if (typeof window.GLTFLoader !== 'function') { console.info('GLTFLoader недоступен — остаёмся на примитивах'); return; }
  if (location.protocol === 'file:') { console.info('file:// — браузер не даст загрузить models/*.glb, остаёмся на примитивах. Для моделей: python -m http.server'); return; }
  const loader = new window.GLTFLoader();
  const targets = { room: S.room, desk: S.desk, chair: S.chair, laptop: S.laptop, phone: S.phone, glass: S.glass, window: S.window, misha: S.misha.root };
  for (const slot of SLOTS) {
    loader.load(slot.file, (gltf) => {
      try { replaceWithModel(slot, gltf, targets[slot.key]); console.info('модель загружена:', slot.file); }
      catch (e) { console.warn('модель не встала:', slot.file, e); }
    }, undefined, (err) => console.info('нет модели', slot.file, '— примитив остаётся', err && err.message || ''));
  }
}

function fitToSize(obj, size) {
  const b = new THREE.Box3().setFromObject(obj), s = new THREE.Vector3(); b.getSize(s);
  const k = Math.min(size[0] / (s.x || 1), size[1] / (s.y || 1), size[2] / (s.z || 1));
  obj.scale.multiplyScalar(k);
  const b2 = new THREE.Box3().setFromObject(obj), c = new THREE.Vector3(); b2.getCenter(c);
  obj.position.x -= c.x; obj.position.z -= c.z; obj.position.y -= b2.min.y; // низ по центру на ноль
}

function replaceWithModel(slot, gltf, prim) {

  const holder = new THREE.Group();
  const inner = new THREE.Group(); inner.add(model); inner.rotation.set(...slot.rot); holder.add(inner);
  fitToSize(inner, slot.size);
  if (slot.key === 'misha') {
    // Миша: модель едет вместе с процедурным корнем; примитивные части прячем
    S.misha.parts.forEach(p => p.visible = false);
    holder.position.set(0, -0.88, 0); // корень процедурного Миши — на уровне таза стоящего

    S.lid.children.forEach(ch => { if (ch !== S.screen) ch.visible = false; });

const raycaster = new THREE.Raycaster();

function screenHit(ev) {

  _ndc.y = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(_ndc, camera);
  const hits = raycaster.intersectObjects([S.screen, S.phoneScreen, S.phoneBody], false);
  if (!hits.length) return null;
  const h = hits[0];
  if (h.object === S.screen && h.uv) return { target: 'mac', x: h.uv.x * LAYOUT.W, y: (1 - h.uv.y) * LAYOUT.H };
  if (h.object === S.phoneScreen && h.uv) return { target: 'phone', x: h.uv.x * LAYOUT.PHONE_W, y: (1 - h.uv.y) * LAYOUT.PHONE_H };

}

function macHitRegion(x, y) {
  const regs = game.ui.regions;
  const layers = ['menubar', 'notif', ...windowsBottomUp().slice().reverse()];
  for (const win of layers) {
    if (win === 'menubar') { if (!inRect(x, y, LAYOUT.menubar)) continue; }
    else if (win === 'notif') { const r = regs.filter(g => g.win === 'notif'); const hit = r.reverse().find(g => inRect(x, y, g.r)); if (hit) return hit; continue; }

    return { win, key: win + ':bg', fn: null };

}

function macClick(x, y) {

}
function phoneClick(x, y) {

}

function debugKey(ev) {

  }

}
let fps = 60, fpsAcc = 0, fpsN = 0, fpsMin = 999;
function updateDebug(dt) {

  for (const id in u) { const x = u[id]; const bar = '#'.repeat(Math.round(x.value / 5)).padEnd(20, '.'); s += `${(x.hotkey === ' ' ? '␣' : x.hotkey)} ${id.padEnd(8)} ${bar} ${x.value.toFixed(0).padStart(3)}${x.active ? ' ACTIVE' : ''}${x.pending ? ' PENDING' : ''}\n`; }
  s += `\nShift+1..8/Shift+Пробел — запустить позыв (Shift+6 — мини-игра)\nT +30с  G +10%  C конц=10  F конц=100  K финал\nB — симуляция баланса (10 прогонов на стратегию)`;

// --- боты для симуляции: те же функции, что и у игрока
const STRATEGIES = {
  perfect: { react: 4.5, acc: 0.92, preReset: 1.0, at: 72, handleDelay: 1.0, pushRate: 3.5, audioSmart: true, bluff: 0 },
  average: { react: 5.5, acc: 0.82, preReset: 0.5, at: 80, handleDelay: 6.0, pushRate: 2.6, audioSmart: false, bluff: 0.5 },
  bad:     { react: 5.5, acc: 0.82, preReset: 0.0, at: 999, handleDelay: 12.0, pushRate: 0, audioSmart: false, bluff: 0, onlyBlocking: true },
};
function makeBot(kind) { return { kind, s: STRATEGIES[kind], plan: null, wait: {}, decide: {}, phoneT: 0, pushT: 0, focusT: 0 }; }
function botStep(bot, dt) {
  const s = bot.s, g = game, rnd = g.rnd;
  // фокус украли — вернуться к учёбе
  if (g.focus !== 'study' && !studyBlocked()) { bot.focusT += dt; if (bot.focusT > 1.0) { g.focus = 'study'; bot.focusT = 0; } } else bot.focusT = 0;
  // заметки
  for (const id of ['notes2', 'notes1']) {
    const w = g.wins[id];
    if (w.open && w.chosen < 0) {
      const delay = s.onlyBlocking ? s.handleDelay : (w.overflow ? s.handleDelay : 1.2);
      if (w.openT > delay) notesChoose(id, Math.floor(rnd() * 3));
    }
  }
  // мини-игра отжиманий
  if (g.pushup && !g.pushup.auto && s.pushRate > 0 && g.action && g.action.t > g.pushup.prep) {
    bot.pushT += dt; if (bot.pushT > 1 / s.pushRate) { bot.pushT = 0; pushupRep(false); }
  }
  // телефон
  const a = g.action;
  if (a && a.kind === 'phone') {
    bot.phoneT += dt;
    const ph = g.phone;
    if (ph.mode === 'reels' && ph.sendT < 0 && bot.phoneT > 1.2) { phonePickReel(0); phoneSend(); }
    if (ph.mode === 'temki' && ph.sendT < 0 && ph.hlOn && ph.hlT < CONFIG.TEMKI_HL_ON - 0.9) phoneTapPost(ph.hl);
    return;
  }
  bot.phoneT = 0;
  // аудиокнига
  if (s.audioSmart) {
    const cs = g.task && g.task.q.subject === 'cs' && g.task.state === 'ask';
    if (cs && g.audioPlaying) toggleAudio();
    else if (!cs && !g.audioPlaying && !g.action && !g.task) toggleAudio();
  } else if (!g.audioPlaying && !g.action && g.urges.audio.value > 60) toggleAudio();
  // привычки
  if (!g.action && g.cam.t >= 1) {
    for (const id in g.urges) {
      const u = g.urges[id];
      if (id === 'audio') continue;
      if (u.active) { // сработавшее окно: обслужить через handleDelay
        if (s.onlyBlocking) continue;
        bot.wait[id] = (bot.wait[id] || 0) + dt;
        if (bot.wait[id] > s.handleDelay) { bot.wait[id] = 0; urgeKey(id); break; }
        continue;
      }
      if (u.value >= s.at && !u.pending) {
        if (id === 'air' && g.windowOpen) continue;
        if (bot.decide[id] === undefined) bot.decide[id] = rnd() < s.preReset;
        if (bot.decide[id]) { bot.decide[id] = undefined; urgeKey(id); break; }
      }
      if (u.value < 10) bot.decide[id] = undefined;
    }
  }
  // задачи
  const t = g.task;
  if (t && t.state === 'ask' && canStudy()) {
    if (!bot.plan || bot.plan.no !== t.no) {
      const blurry = g.concentration < CONFIG.CONC_HEAVY ? 0.1 : 0;
      bot.plan = { no: t.no, at: s.react * (0.7 + rnd() * 0.6), ok: rnd() < s.acc - blurry, bluff: g.bluffCD <= 0 && rnd() < s.bluff, el: 0 };
    }
    bot.plan.el += dt;
    if (bot.plan.bluff && bot.plan.el > 1) bluff();
    else if (bot.plan.el >= bot.plan.at) answer(bot.plan.ok ? t.correct : (t.correct + 1 + Math.floor(rnd() * 3)) % 4);
  }
}
function visibleStudyFraction() {
  // доля площади учебного окна, перекрытая окнами выше (грубо, по сетке)
  const r = game.wins.study.rect; let cov = 0, n = 0;
  const above = windowsBottomUp().filter(id => id !== 'study').map(id => game.wins[id].rect);
  for (let x = r[0]; x < r[0] + r[2]; x += 20) for (let y = r[1]; y < r[1] + r[3]; y += 20) { n++; if (above.some(a => inRect(x, y, a))) cov++; }
  return 1 - cov / n;
}
function runSim(kind, seed) {
  const saved = game;
  game = newGame({ sim: true, noCap: true, seed });
  game.tutorialShown = true; game.cam = { mode: 'FIRST', from: 'FIRST', to: 'FIRST', t: 1, dur: CONFIG.CAM_TRANSITION };
  const bot = makeBot(kind), dt = 1 / 20;
  let mid = null, end = null, midVis = 1, endVis = 1;
  while (game.phase === 'play') {
    botStep(bot, dt); update(dt);
    const open = windowsBottomUp().length;
    if (!mid && game.elapsed >= 180) { mid = open; midVis = visibleStudyFraction(); }
    if (!end && game.elapsed >= 330) { end = open; endVis = visibleStudyFraction(); }
  }
  const out = { progress: game.progress, mid, end, midVis, endVis, stats: Object.assign({}, game.stats), conc: game.concentration };
  game = saved;
  return out;
}
function runBalance(n = 20) {
  return Object.keys(STRATEGIES).map(kind => {
    const rs = []; for (let i = 0; i < n; i++) rs.push(runSim(kind, 1000 + i * 7919));
    const ps = rs.map(r => r.progress);
    const avg = x => x.reduce((a, b) => a + b, 0) / x.length;
    return { strategy: kind, avg: avg(ps).toFixed(1), min: Math.min(...ps).toFixed(0), max: Math.max(...ps).toFixed(0),
      midWindows: avg(rs.map(r => r.mid)).toFixed(1), endWindows: avg(rs.map(r => r.end)).toFixed(1),
      midStudyVisible: (avg(rs.map(r => r.midVis)) * 100).toFixed(0) + '%', endStudyVisible: (avg(rs.map(r => r.endVis)) * 100).toFixed(0) + '%',
      correct: avg(rs.map(r => r.stats.correct)).toFixed(1), failed: avg(rs.map(r => r.stats.failed)).toFixed(1), distractions: avg(rs.map(r => r.stats.distractions)).toFixed(1) };
  });
}

function render3D(dt, now) {
  // крышка уже выставлена интро; окно комнаты и занавеска
  const sashTarget = game.windowOpen ? -70 * Math.PI / 180 : 0;
  S.sash.rotation.y += (sashTarget - S.sash.rotation.y) * (1 - Math.exp(-dt * 4));
  const pos = S.curtain.geometry.attributes.position, base = S.curtainBase;
  const open = Math.abs(S.sash.rotation.y) / (70 * Math.PI / 180);
  if (open > 0.01 || S.curtainMoving) {
    for (let i = 0; i < pos.count; i++) {
      const y = base[i * 3 + 1], x = base[i * 3];
      const fall = (0.7 - y) / 1.4;
      pos.array[i * 3 + 2] = base[i * 3 + 2] + Math.sin(now * 2.2 + y * 3 + x * 8) * 0.04 * open * clamp(fall + 0.3, 0, 1);
    }
    pos.needsUpdate = true; S.curtainMoving = open > 0.01;
  }
  // телефон: в руке или на столе
  const holding = game.action && game.action.kind === 'phone';
  const pt = holding ? S.phoneHold : S.phoneHome.pos, pq = holding ? S.phoneHoldQuat : S.phoneHome.quat;
  const kk = 1 - Math.exp(-dt * 10);
  S.phone.position.lerp(pt, kk); S.phone.quaternion.slerp(pq, kk);
  // пузырь над Мишей
  updateBubble();
  S.faceLight.intensity = game.screenOff ? 0 : 0.35;
  applyCamera(now);
  renderer.render(scene, camera);
}

// веки: при высоком позыве сна в первом лице глаза закрываются и моргают
const lidTop = document.getElementById('lidTop'), lidBot = document.getElementById('lidBot');
let blinkT = 0, lastLid = -1;
function updateEyelids(dt, now) {
  let k = 0;
  if (game.phase === 'play' && game.cam.mode === 'FIRST' && !game.paused) {
    const v = game.urges.sleep.value;
    if (v > 60) k = (v - 60) / 40 * 0.22;
    blinkT -= dt;
    if (v > 75 && blinkT < -2.5 + (v - 75) / 25 * 2) blinkT = 0.25;
    if (blinkT > 0) k = Math.max(k, Math.sin((blinkT / 0.25) * Math.PI) * 0.5);
  }
  if (game.action && game.action.urge === 'sleep') k = 0;
  const pct = Math.round(k * 1000) / 10;

}

let lastT = performance.now();
function frame(ts) {
  requestAnimationFrame(frame);
  let dt = (ts - lastT) / 1000; lastT = ts;
  if (dt > 0.1) dt = 0.1; // вкладка была неактивна
  const now = ts / 1000;
  update(dt);
  if (!game.paused) updateMisha(dt, now);
  processHover();
  if (game.screenDirty || screenAnimating()) { renderScreen(now); screenTex.needsUpdate = true; game.screenDirty = false; }
  if (game.phoneDirty || phoneAnimating()) { renderPhone(now); phoneTex.needsUpdate = true; game.phoneDirty = false; }
  updateEyelids(dt, now);
  render3D(game.paused ? 0 : dt, now);
  updateDebug(dt);
}

function onResize() {
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
}

// старт
game = newGame();
initThree();
S.lid.rotation.x = Math.PI / 2 - 0.02;
S.misha.pose = Object.assign({}, POSE_STAND, { x: 1.3, z: 1.1, ry: -Math.PI / 2, chair: 0.25 });
S.misha.state = 'SITTING';
playAnim('SITTING');
S.misha.state = 'WIN_IDLE';
ANIMS.WIN_IDLE = () => Object.assign({}, POSE_STAND, { x: 1.3, z: 1.1, ry: -Math.PI / 2, chair: 0.25 });
tryLoadModels();
window.addEventListener('resize', onResize);
window.addEventListener('pointerdown', (e) => { if (e.target.closest && e.target.closest('#endOv')) return; if (game.phase === 'title') { startIntro(); return; } onPointerDown(e); });
window.addEventListener('pointermove', onPointerMove);
window.addEventListener('keydown', onKeyDown);
window.addEventListener('blur', () => { if (game.phase === 'play' && !game.paused) togglePause(); });
requestAnimationFrame(frame);
window.__game = () => game; // для отладки из консоли
</script>
</body>
</html>
